plugins {
    id 'application'
}

description = 'Agentic SDLC orchestrator: governed, stateful, graph-based execution of software changes'

dependencies {
    implementation libs.jackson
    // The build/test agent runs JUnit suites inside the change workspace, so JUnit is a runtime dependency here.
    implementation libs.junit
}

application {
    mainClass = 'com.example.agentic.cli.AgenticCli'
    applicationName = 'agentic'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
    standardInput = System.in
}

tasks.withType(Test).configureEach {
    workingDir = rootProject.projectDir
    // End-to-end scenario tests build and test a generated Spring Boot workspace with Gradle (needs the
    // dependency cache or network). -PskipE2E runs only the unit and engine tests.
    maxHeapSize = '1g'
    if (project.hasProperty('skipE2E')) {
        exclude '**/ScenarioEndToEndTest*'
    }
}
