// Root build.
// - shortener-service: a self-contained Spring Boot 4 build (see shortener-service/build.gradle), so the
//   orchestrator can also build a copy of it in isolation.
// - orchestrator: plain Java 17 + Jackson; configured here.
project(':orchestrator') {
    apply plugin: 'java'

    group = 'com.example'
    version = '1.0.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        // -PofflineLibs=<dir> resolves jars from a local folder (air-gapped builds).
        if (rootProject.hasProperty('offlineLibs')) {
            flatDir { dirs rootProject.file(rootProject.property('offlineLibs')) }
        } else {
            mavenCentral()
        }
    }

    ext.libs = [
        jackson: rootProject.hasProperty('offlineLibs')
            ? [':jackson-databind:2.16.1', ':jackson-core:2.16.1', ':jackson-annotations:2.16.1']
            : ['com.fasterxml.jackson.core:jackson-databind:2.16.1'],
        junit  : rootProject.hasProperty('offlineLibs')
            ? [':junit:4.13.2', ':hamcrest-core:1.3']
            : ['junit:junit:4.13.2'],
    ]

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-Werror']
    }

    tasks.withType(Test).configureEach {
        useJUnit()
        testLogging { events 'failed'; exceptionFormat = 'full' }
    }
}
